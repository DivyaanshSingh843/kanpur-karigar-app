<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanpur Karigar — Notifications & Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="device-wrapper">
    <a href="index.html" class="hub-pill"><i class="fa-solid fa-arrow-left"></i> All Screens</a>
    <div class="notch"><div class="lens"></div></div>

    <div class="screen-viewport">
      <div class="status-bar">
        <span class="status-bar-time">9:41</span>
        <div class="status-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-full"></i>
        </div>
      </div>

      <div class="app-screen">
        <div class="screen-back-header">
          <a class="btn-back" href="employer-dashboard.html"><i class="fa-solid fa-arrow-left"></i> Back</a>
          <span class="tag primary">Activity Center</span>
        </div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:14px;">Notifications</h2>

        <div class="card" style="border-left:4px solid var(--accent-green);">
          <div style="display:flex;gap:12px;">
            <i class="fa-solid fa-circle-check" style="color:var(--accent-green);font-size:20px;margin-top:2px;"></i>
            <div style="flex:1;">
              <div style="font-size:14px;font-weight:800;">Sharma Sweets Shortlisted You</div>
              <div style="font-size:12px;color:var(--text-secondary);margin:2px 0 8px 0;">Master Halwai role • 14 Feb Wedding Order</div>
              <a class="btn-primary" href="whatsapp-mitra.html" style="padding:6px 12px;font-size:11px;width:auto;display:inline-flex;">
                Open WhatsApp Broadcast
              </a>
            </div>
          </div>
        </div>

        <div class="card" style="border-left:4px solid var(--primary);">
          <div style="display:flex;gap:12px;">
            <i class="fa-solid fa-bullhorn" style="color:var(--primary);font-size:20px;margin-top:2px;"></i>
            <div>
              <div style="font-size:14px;font-weight:800;">New Requirement Posted in Kidwai Nagar</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">2 Halwai needed • ₹18,000/Month</div>
              <span style="font-size:11px;color:#A8A29E;display:block;margin-top:6px;">15 mins ago</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a class="nav-item" href="employer-dashboard.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a class="nav-item" href="search.html">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Search</span>
      </a>
      <a class="nav-item" href="post-job.html">
        <i class="fa-solid fa-circle-plus" style="font-size:24px;color:var(--primary);"></i>
        <span>Post Job</span>
      </a>
      <a class="nav-item active" href="notifications.html">
        <i class="fa-solid fa-bell"></i>
        <span>Alerts</span>
      </a>
      <a class="nav-item" href="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>Account</span>
      </a>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
