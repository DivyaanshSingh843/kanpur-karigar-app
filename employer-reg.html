<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanpur Karigar — Employer Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="device-wrapper">
    <a href="index.html" class="hub-pill"><i class="fa-solid fa-arrow-left"></i> All Screens</a>
    <div class="notch"><div class="lens"></div></div>

    <div class="screen-viewport">
      <div class="status-bar">
        <span class="status-bar-time">9:41</span>
        <div class="status-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-full"></i>
        </div>
      </div>

      <div class="app-screen" style="padding-bottom:40px;">
        <div class="screen-back-header">
          <a class="btn-back" href="onboarding.html"><i class="fa-solid fa-arrow-left"></i> Back</a>
          <span class="tag primary">Step 3 of 3</span>
        </div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:4px;">Register Your Business</h2>
        <p style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;">Complete your profile to post jobs and search verified talent</p>

        <div class="card">
          <div class="input-group">
            <label class="input-label">Owner / Manager Full Name</label>
            <input type="text" class="input-field" value="Rajesh Sharma">
          </div>

          <div class="input-group">
            <label class="input-label">Business / Shop Name</label>
            <input type="text" class="input-field" value="Sharma Sweets & Caterers">
          </div>

          <div class="input-group">
            <label class="input-label">Business Category</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">
              <span class="tag primary" style="cursor:pointer;">Sweet Shop</span>
              <span class="tag" style="cursor:pointer;">Catering</span>
              <span class="tag" style="cursor:pointer;">Dhaba</span>
              <span class="tag" style="cursor:pointer;">Restaurant</span>
              <span class="tag" style="cursor:pointer;">Food Cart (Thela)</span>
              <span class="tag" style="cursor:pointer;">Cloud Kitchen</span>
            </div>
          </div>

          <div class="input-group" style="margin-bottom:0;">
            <label class="input-label">Operating Locality in Kanpur</label>
            <select class="input-field" style="background:#FFF;">
              <option selected>Kidwai Nagar, Kanpur</option>
              <option>Gumti No. 5, Kanpur</option>
              <option>Swaroop Nagar, Kanpur</option>
              <option>Govind Nagar, Kanpur</option>
              <option>Civil Lines, Kanpur</option>
              <option>Birhana Road, Kanpur</option>
              <option>Kalyanpur, Kanpur</option>
            </select>
          </div>
        </div>

        <a class="btn-primary" href="employer-dashboard.html">
          Create Business Profile <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
