<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanpur Karigar — My Account & Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="device-wrapper">
    <a href="index.html" class="hub-pill"><i class="fa-solid fa-arrow-left"></i> All Screens</a>
    <div class="notch"><div class="lens"></div></div>

    <div class="screen-viewport">
      <div class="status-bar">
        <span class="status-bar-time">9:41</span>
        <div class="status-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-full"></i>
        </div>
      </div>

      <div class="app-screen">
        <div class="screen-back-header">
          <a class="btn-back" href="employer-dashboard.html"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
          <span class="tag green"><i class="fa-solid fa-shield-halved"></i> Active Account</span>
        </div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:14px;">My Profile & Settings</h2>

        <div class="card" style="text-align:center;">
          <div class="karigar-avatar" style="width:70px;height:70px;font-size:26px;margin:0 auto 10px auto;">SS</div>
          <div style="font-size:18px;font-weight:800;">Sharma Sweets & Caterers</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">Kidwai Nagar, Kanpur • Member since 2024</div>
        </div>

        <div class="card">
          <a href="onboarding.html" style="text-decoration:none;color:inherit;display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F5F5F4;">
            <span><i class="fa-solid fa-language" style="color:var(--primary);margin-right:10px;"></i> App Language (English)</span>
            <i class="fa-solid fa-chevron-right" style="color:#A8A29E;"></i>
          </a>
          <a href="admin-panel.html" style="text-decoration:none;color:inherit;display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F5F5F4;">
            <span><i class="fa-solid fa-user-gear" style="color:var(--secondary);margin-right:10px;"></i> Admin Dispatch Portal</span>
            <i class="fa-solid fa-chevron-right" style="color:#A8A29E;"></i>
          </a>
          <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F5F5F4;">
            <span><i class="fa-solid fa-phone" style="color:var(--accent-green);margin-right:10px;"></i> Kanpur Support Helpline</span>
            <b>0512-233-XXXX</b>
          </div>
          <a href="onboarding.html" style="text-decoration:none;display:flex;justify-content:space-between;padding:12px 0;">
            <span style="color:#DC2626;font-weight:700;"><i class="fa-solid fa-right-from-bracket" style="margin-right:10px;"></i> Log Out</span>
          </a>
        </div>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a class="nav-item" href="employer-dashboard.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a class="nav-item" href="search.html">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Search</span>
      </a>
      <a class="nav-item" href="post-job.html">
        <i class="fa-solid fa-circle-plus" style="font-size:24px;color:var(--primary);"></i>
        <span>Post Job</span>
      </a>
      <a class="nav-item" href="notifications.html">
        <i class="fa-solid fa-bell"></i>
        <span>Alerts</span>
      </a>
      <a class="nav-item active" href="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>Account</span>
      </a>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
