<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanpur Karigar — Post Requirement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="device-wrapper">
    <a href="index.html" class="hub-pill"><i class="fa-solid fa-arrow-left"></i> All Screens</a>
    <div class="notch"><div class="lens"></div></div>

    <div class="screen-viewport">
      <div class="status-bar">
        <span class="status-bar-time">9:41</span>
        <div class="status-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-full"></i>
        </div>
      </div>

      <div class="app-screen">
        <div class="screen-back-header">
          <a class="btn-back" href="employer-dashboard.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
          <span class="tag green"><i class="fa-solid fa-bolt"></i> Free Posting</span>
        </div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:4px;">Post New Requirement</h2>
        <p style="font-size:12px;color:var(--text-secondary);margin-bottom:14px;">Broadcast to 2,500+ food artisans across Kanpur</p>

        <div class="card">
          <div class="input-group">
            <label class="input-label">Job Title / Role Required</label>
            <input type="text" class="input-field" value="Master Halwai (Sweets Specialist)">
          </div>

          <div class="input-group">
            <label class="input-label">Required Craft & Dish Skills</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
              <span class="tag primary">Jalebi & Imarti ✕</span>
              <span class="tag primary">Gulab Jamun ✕</span>
              <span class="tag primary">Mawa Barfi ✕</span>
            </div>
            <input type="text" class="input-field" placeholder="+ Add more skills (e.g. Kaju Katli)">
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div class="input-group">
              <label class="input-label">Vacancies</label>
              <input type="number" class="input-field" value="2">
            </div>
            <div class="input-group">
              <label class="input-label">Min. Experience</label>
              <select class="input-field" style="background:#FFF;">
                <option>2+ Years</option>
                <option selected>5+ Years</option>
                <option>8+ Years</option>
              </select>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">Salary Offer</label>
            <div style="display:flex;gap:10px;">
              <input type="text" class="input-field" value="₹18,000 - ₹20,000" style="width:65%;">
              <select class="input-field" style="width:35%;background:#FFF;">
                <option selected>Monthly</option>
                <option>Daily</option>
              </select>
            </div>
          </div>

          <div class="input-group" style="margin-bottom:0;">
            <label class="input-label">Job Duration Type</label>
            <div style="display:flex;gap:6px;">
              <span class="tag primary">Full Time</span>
              <span class="tag">Part Time</span>
              <span class="tag">Wedding / Event</span>
            </div>
          </div>
        </div>

        <button class="btn-primary" onclick="showToast('🎉 Requirement successfully published! Broadcasted to local artisans.'); setTimeout(() => location.href='employer-dashboard.html', 1500);">
          Publish Requirement (Free) <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <a class="nav-item" href="employer-dashboard.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a class="nav-item" href="search.html">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Search</span>
      </a>
      <a class="nav-item active" href="post-job.html">
        <i class="fa-solid fa-circle-plus" style="font-size:24px;color:var(--primary);"></i>
        <span>Post Job</span>
      </a>
      <a class="nav-item" href="notifications.html">
        <i class="fa-solid fa-bell"></i>
        <span>Alerts</span>
      </a>
      <a class="nav-item" href="profile.html">
        <i class="fa-solid fa-user"></i>
        <span>Account</span>
      </a>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
